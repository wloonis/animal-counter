---

# WiFi Hotspot Configuration
wifi_hotspot:
  ssid: "{{ lookup('env', 'JETSON_HOTSPOT_SSID') | default('JetsonCounter') }}"
  password: "{{ lookup('env', 'JETSON_HOTSPOT_PASSWORD') | default('ChangeMe123') }}"
  ip: "{{ lookup('env', 'JETSON_HOTSPOT_IP') | default('192.168.50.1/24') }}"
  interface: "{{ lookup('env', 'JETSON_HOTSPOT_INTERFACE') | default('wlP1p1s0') }}"

# Ethernet Configuration
ethernet_static:
  interface: "{{ lookup('env', 'JETSON_ETH_INTERFACE') | default('enP8p1s0') }}"
  ip: "{{ lookup('env', 'JETSON_ETH_IP') | default('192.168.1.50/24') }}"
  gateway: "{{ lookup('env', 'JETSON_ETH_GATEWAY') | default('192.168.1.1') }}"

# SSH Configuration
ssh_config:
  user: "{{ lookup('env', 'JETSON_USER') | default('nano-counter') }}"
  password: "{{ lookup('env', 'JETSON_PASSWORD') | default(omit) }}"
  port: 22

# No-detection timeout (s): single source of truth for recording stop (app)
# and cronvideo compression trim (cron pod). Templated into cronvideo-dep.j2 as TRIM_TAIL.
delay_last_class: "{{ lookup('env', 'DELAY_LAST_CLASS') | default(180) }}"

# Application Configuration
app_config:
  namespace: "{{ lookup('env', 'APP_NAMESPACE') | default('countingapp-dev') }}"
  name: "{{ lookup('env', 'APP_NAME') | default('countingapp') }}"
  version: "{{ lookup('env', 'APP_VERSION') | default('local') }}"
  port: "{{ lookup('env', 'APP_PORT') | default('31501') }}"
  video_device: "{{ lookup('env', 'VIDEO_DEVICE') | default('/dev/video0') }}"
  path: "{{ lookup('env', 'APP_PATH') | default('/data/orin/git/animal-counting/app') }}"
  files_path: "{{ lookup('env', 'FILES_PATH') | default('/data/orin/files') }}"
  max_log_files: "{{ lookup('env', 'MAX_LOG_FILES') | default('50') }}"
  log_max_size: "{{ lookup('env', 'LOG_MAX_SIZE') | default('100M') }}"
  jetson_ip: "{{ lookup('env', 'JETSON_IP') | default(omit) }}"

# FileBrowser Configuration
filebrowser_config:
  port: "{{ lookup('env', 'FILEBROWSER_PORT') | default('80') }}"
  base_url: "{{ lookup('env', 'FILEBROWSER_BASE_URL') | default('/') }}"
  cache_dir: "{{ lookup('env', 'FILEBROWSER_CACHE_DIR') | default('/data/tmp') }}"
  database: "{{ lookup('env', 'FILEBROWSER_DATABASE') | default('/data/database.db') }}"
  srv_path: "{{ lookup('env', 'FILEBROWSER_SRV_PATH') | default('/srv') }}"
  admin_username: "{{ lookup('env', 'FILEBROWSER_ADMIN_USERNAME') | default('admin') }}"
  admin_password: "{{ lookup('env', 'FILEBROWSER_ADMIN_PASSWORD') | default('admin') }}"
  image: "{{ lookup('env', 'FILEBROWSER_IMAGE') | default('ghcr.io/gtsteffaniak/filebrowser:stable') }}"
  config_path: "{{ lookup('env', 'FILEBROWSER_CONFIG_PATH') | default('/data/orin/git/animal-counting/config/filebrowser/') }}"

# Build Configuration
build_config:
  image_name: "{{ lookup('env', 'IMAGE_NAME') | default('countingapp') }}"
  image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('local') }}"

- name: Train YOLO locally
  hosts: all
  become: true
  gather_facts: yes

  vars:
    app_namespace: "{{ lookup('env', 'APP_NAMESPACE') | default('countingapp-dev', true) }}"
    app_name: "{{ lookup('env', 'APP_NAME') | default('countingapp', true) }}"
    app_version: "{{ lookup('env', 'APP_VERSION') | default('local', true) }}"
    app_path: "{{ lookup('env', 'APP_PATH') | default('/data/orin/git/animal-counting/app', true) }}"
    files_path: "{{ lookup('env', 'FILES_PATH') | default('/data/orin/files', true) }}"
    project_dir: "{{ lookup('env', 'TRAINING_PROJECT_DIR') }}"
    local_app_path: "{{ lookup('env', 'LOCAL_APP_PATH') }}"
    data_path: "{{ lookup('env', 'TRAINING_DATA_PATH') }}"
    model: "{{ lookup('env', 'TRAINING_MODEL') }}"
    epochs: "{{ lookup('env', 'TRAINING_EPOCHS') }}"
    imgsz: "{{ lookup('env', 'TRAINING_IMGSZ') }}"
    device: "{{ lookup('env', 'TRAINING_DEVICE') | default('gpu') }}"
    roboflow_workspace: "{{ lookup('env', 'TRAINING_ROBOFLOW_WORKSPACE') }}"
    roboflow_project: "{{ lookup('env', 'TRAINING_ROBOFLOW_PROJECT') }}"
    roboflow_version: "{{ lookup('env', 'TRAINING_ROBOFLOW_VERSION') }}"
    roboflow_format: "{{ lookup('env', 'TRAINING_ROBOFLOW_FORMAT') }}"
    roboflow_api_key: "{{ lookup('env', 'TRAINING_ROBOFLOW_API_KEY') }}"
    default_counting_class: "{{ lookup('env', 'TRAINING_DEFAULT_COUNTING_CLASS') | default('1', true) }}"
    # Dataset source — 'roboflow' (default: download from Roboflow, current
    # behavior) or 'local' (use an already-prepared dataset at TRAINING_PROJECT_DIR,
    # prepared once by scripts/prepare_local_dataset.py — no Roboflow fetch).
    dataset_source: "{{ lookup('env', 'TRAINING_DATASET_SOURCE') | default('roboflow', true) }}"

    files_to_move:
      - train
      - valid
      - test
      - data.yaml
      - dataset.zip

  tasks:

    - name: Check project directory exists
      ansible.builtin.stat:
        path: "{{ project_dir }}"
      register: project_dir_stat
      delegate_to: localhost
      become: false

    - name: Fail if project directory missing
      ansible.builtin.fail:
        msg: "Project directory {{ project_dir }} does not exist"
      when: not project_dir_stat.stat.exists
      delegate_to: localhost
      become: false

    - name: Check if runs directory exists
      stat:
        path: "{{ project_dir }}/runs"
      delegate_to: localhost
      become: false
      register: runs_dir

    - name: Move previous dataset files into runs directory
      command: >
        mv {{ project_dir }}/{{ item }}
        {{ project_dir }}/runs/
      loop: "{{ files_to_move }}"
      args:
        removes: "{{ project_dir }}/{{ item }}"
      when: runs_dir.stat.exists and dataset_source == 'roboflow'
      ignore_errors: true
      delegate_to: localhost
      become: false

    - name: Retrieve Roboflow export metadata
      uri:
        url: >-
          https://api.roboflow.com/{{ roboflow_workspace }}/{{ roboflow_project }}/{{ roboflow_version }}/{{ roboflow_format }}?api_key={{ roboflow_api_key }}
        method: GET
        return_content: true
      register: roboflow_metadata
      when: dataset_source == 'roboflow'
      delegate_to: localhost
      become: false

    - name: Extract dataset download URL
      set_fact:
        roboflow_download_url: "{{ roboflow_metadata.json.export.link }}"
      when: dataset_source == 'roboflow'

    - name: Download dataset zip
      get_url:
        url: "{{ roboflow_download_url }}"
        dest: "{{ project_dir }}/dataset.zip"
        mode: '0644'
      when: dataset_source == 'roboflow'
      delegate_to: localhost
      become: false

    - name: Unarchive dataset
      unarchive:
        src: "{{ project_dir }}/dataset.zip"
        dest: "{{ project_dir }}"
        remote_src: true
      when: dataset_source == 'roboflow'
      delegate_to: localhost
      become: false

    - name: Verify prepared dataset exists (local source)
      ansible.builtin.stat:
        path: "{{ project_dir }}/data.yaml"
      register: local_data_yaml
      when: dataset_source == 'local'
      delegate_to: localhost
      become: false

    - name: Fail if local dataset not prepared
      ansible.builtin.fail:
        msg: >-
          TRAINING_DATASET_SOURCE=local but {{ project_dir }}/data.yaml not found.
          Prepare the dataset first with scripts/prepare_local_dataset.py
          (--out {{ project_dir }}).
      when: dataset_source == 'local' and not local_data_yaml.stat.exists
      delegate_to: localhost
      become: false

    - name: Slurp data.yaml
      ansible.builtin.slurp:
        src: "{{ project_dir }}/data.yaml"
      register: data_yaml_slurp
      delegate_to: localhost
      become: false

    - name: Parse data.yaml (nc + names)
      ansible.builtin.set_fact:
        _data_yaml: "{{ data_yaml_slurp.content | b64decode | from_yaml }}"

    - name: Normalize dataset names to a list
      ansible.builtin.set_fact:
        dataset_nc: "{{ _data_yaml.nc | int }}"
        dataset_names: "{{ (_data_yaml.names | dictsort | map(attribute=1) | list) if (_data_yaml.names is mapping) else _data_yaml.names }}"

    - name: Fail-fast if default_counting_class out of range
      ansible.builtin.fail:
        msg: >-
          default_counting_class={{ default_counting_class }} is out of range
          [0, {{ dataset_nc }}); resolved class name: {{ dataset_names[default_counting_class | int] | default('<invalid>') }}
      when: (default_counting_class | int) < 0 or (default_counting_class | int) >= (dataset_nc | int)
      delegate_to: localhost
      become: false

    - name: Log resolved default counting class
      ansible.builtin.debug:
        msg: >-
          Resolved default_counting_class={{ default_counting_class | int }}
          ({{ dataset_names[default_counting_class | int] }}) from nc={{ dataset_nc }}
          names={{ dataset_names }}
      delegate_to: localhost
      become: false

    - name: Write classes.yaml (model classes source of truth)
      ansible.builtin.copy:
        dest: "{{ local_app_path }}/model/classes.yaml"
        mode: '0644'
        content: |
          model_version: {{ roboflow_version }}
          nc: {{ dataset_nc }}
          names:
          {% for class_name in dataset_names %}
          - {{ class_name }}
          {% endfor %}
          default_counting_class: {{ default_counting_class | int }}
      delegate_to: localhost
      become: false

    - name: Backup existing runs directory
      ansible.builtin.shell: |
        if [ -d "{{ project_dir }}/runs" ]; then
          mv "{{ project_dir }}/runs" "{{ project_dir }}/runs-$(date +%Y%m%d_%H%M%S)"
        fi
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false

    - name: Run YOLO training
      ansible.builtin.shell: |
        source /mnt/c/Dev/venv/ultralytics/bin/activate
        yolo detect train \
          data={{ data_path }} \
          model=../{{ model }} \
          epochs={{ epochs }} \
          batch=-1 \
          imgsz={{ imgsz }}
      args:
        chdir: "{{ project_dir }}"
        executable: /bin/bash
      delegate_to: localhost
      become: false

    - name: Copy trained model to app directory
      ansible.builtin.copy:
        src: "{{ project_dir }}/runs/detect/train/weights/best.pt"
        dest: "{{ local_app_path }}/model/my_model.pt"
      delegate_to: localhost
      become: false

    - name: Run YOLO onnx export
      ansible.builtin.shell: |
        source /mnt/c/Dev/venv/ultralytics/bin/activate
        yolo export \
          model="{{ local_app_path }}/model/my_model.pt" \
          opset=13 \
          simplify=True \
          format=onnx \
          half=True
      args:
        chdir: "{{ local_app_path }}/model/"
        executable: /bin/bash
      delegate_to: localhost
      become: false

    - name: Copy ONNX model to Jetson
      command: >
        rsync -avz --no-owner --no-group
        -e "sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        "{{ local_app_path }}/model/my_model.onnx"
        {{ ansible_user }}@{{ ansible_host }}:{{ app_path }}/model/
      environment:
        SSHPASS: "{{ ansible_become_password }}"
      delegate_to: localhost
      become: false
      tags: build

    - name: Copy classes.yaml to Jetson
      command: >
        rsync -avz --no-owner --no-group
        -e "sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        "{{ local_app_path }}/model/classes.yaml"
        {{ ansible_user }}@{{ ansible_host }}:{{ app_path }}/model/
      environment:
        SSHPASS: "{{ ansible_become_password }}"
      delegate_to: localhost
      become: false
      tags: build

    - name: Disable counting app (delete k3s deployment)
      ansible.builtin.command: >
        kubectl delete -f {{ app_path }}/../k3s/countingapp-dep.yaml --ignore-not-found
      become: true

    - name: Check if engine exists
      ansible.builtin.stat:
        path: "{{ app_path }}/model/my_model.engine"
      register: engine_file
      become: true

    - name: Créer le répertoire old
      file:
        path: "{{ app_path }}/model/old/"
        state: directory
        mode: '0755'
      become: yes

    - name: Backup engine with timestamp (shell)
      ansible.builtin.shell: >
        mv {{ app_path }}/model/my_model.engine
        {{ app_path }}/model/old/my_model.engine.$(date +%Y%m%d_%H%M)
      args:
        executable: /bin/bash
      when: engine_file.stat.exists
      become: true

    - name: Check if k3s file exists
      stat:
        path: "{{ app_path }}/../k3s/build-engine-batch.yaml"
      register: build_engine_file

    - name: Render build-engine template
      template:
        src: "../../../k3s/templates/build-engine-batch.j2"
        dest: "{{ app_path }}/../k3s/build-engine-batch.yaml"
      become: yes
      when: not build_engine_file.stat.exists

    - name: Delete previous build-engine job if exists
      ansible.builtin.command: >
        kubectl delete -f {{ app_path }}/../k3s/build-engine-batch.yaml --ignore-not-found
      become: true

    - name: Enable build engine (apply k3s batch)
      ansible.builtin.command: >
        kubectl apply -f {{ app_path }}/../k3s/build-engine-batch.yaml
      become: true

    - name: Wait for engine build job to complete
      ansible.builtin.command: >
        kubectl -n countingapp-dev wait --for=condition=complete
        job/build-engine
        --timeout=1200s
      become: true

    - name: Wait for engine file
      ansible.builtin.wait_for:
        path: "{{ app_path }}/model/my_model.engine"
        timeout: 300
      become: true

    - name: Render counting app test
      template:
        src: "../../../k3s/templates/countingapp-test.j2"
        dest: "{{ app_path }}/../k3s/countingapp-test.yaml"
      become: yes

    - name: Enable counting app test (apply k3s deployment)
      ansible.builtin.command: >
        kubectl apply -f {{ app_path }}/../k3s/countingapp-test.yaml
      become: true

    - name: Enable counting app (apply k3s deployment)
      ansible.builtin.command: >
        kubectl apply -f {{ app_path }}/../k3s/countingapp-dep.yaml
      become: true



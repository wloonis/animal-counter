---
# K3s installation for Jetson Orin Nano — WiFi-only deployment.
#
# The Jetson has NO ethernet cable in production and NO RTC battery, so:
#   - K3s node-ip lives on a DUMMY virtual interface (always UP, no carrier
#     needed) instead of the physical ethernet (which is linkdown without a
#     cable). This keeps the node-ip stable regardless of WiFi mode
#     (internet WiFi vs hotspot).
#   - The system clock is restored at boot by fake-hwclock (no RTC battery)
#     and re-applied right before k3s starts (ExecStartPre) — a late RTC
#     sync from the dead onboard RTC would otherwise reset it to 1970.
#   - k3s-clock-ready is a belt-and-suspenders gate: on a fresh install with
#     no fake-hwclock data yet, it waits for the phone (BL-65) to push time
#     over the hotspot before letting k3s start.
- name: Set docker and k3s variables from environment
  set_fact:
    docker_path: "{{ lookup('env', 'DOCKER_PATH') | default('/data/orin/docker', true) }}"
    # node_ip reuses JETSON_ETH_IP (192.168.50.10/24) — the value is now carried
    # by the dummy0 interface, not ethernet. Kept under the same env key to
    # avoid touching .env.local.
    node_ip: "{{ lookup('env', 'JETSON_ETH_IP') | default('192.168.50.10/24', true) }}"
    dummy_iface: dummy0
  tags: always

- name: Créer le dossier K3s
  file:
    path: "{{ docker_path}}"
    state: directory
    mode: '0755'
  become: yes

- name: Configure Docker daemon for external storage
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "data-root": "{{ docker_path}}",
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "100m",
          "max-file": "3"
        }        
      }
    owner: root
    group: root
    mode: '0644'
  tags: docker

# --------------------------------------------------
# 4. Override systemd pour Docker
# --------------------------------------------------
- name: Create docker systemd override directory
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: Ensure Docker waits for mounted disk
  copy:
    dest: /etc/systemd/system/docker.service.d/override.conf
    content: |
      [Unit]
      After=network-online.target
      Wants=network-online.target

# --------------------------------------------------
# 5. Activer Docker au boot
# --------------------------------------------------
- name: Ensure Docker is enabled
  service:
    name: docker
    enabled: true
    state: started


- name: Check if NVIDIA runtime already configured
  command: grep -q nvidia /etc/docker/daemon.json
  register: nvidia_runtime
  changed_when: false
  failed_when: false

- name: Configure NVIDIA runtime for Docker
  command: nvidia-ctk runtime configure --runtime=docker --set-as-default
  become: true
  # Skip if already configured: nvidia-ctk restarts docker, and k3s
  # (Requires=docker.service) is stopped when docker restarts — leaving k3s
  # down on re-runs. Only run the (re)configuration when it's not already set.
  when: nvidia_runtime.rc != 0

- name: Ajouter options cgroup à la fin de la ligne APPEND
  lineinfile:
    path: /boot/extlinux/extlinux.conf
    regexp: '^(\s*APPEND.*)$'
    line: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
    backrefs: yes

# - name: Reboot si nécessaire
#   reboot:
#     msg: "Reboot après modification"
#     reboot_timeout: 600

- name: Vérifier que la machine est revenue
  command: uptime

- name: Disable swap (required by k3s)
  command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0
  tags: prepare

# --------------------------------------------------
# 6. fake-hwclock — restore system clock at boot (no RTC battery)
# --------------------------------------------------
- name: Installer fake-hwclock (pas de pile RTC sur le Jetson)
  apt:
    name: fake-hwclock
    state: present
    update_cache: yes
  become: yes

- name: Activer fake-hwclock au boot
  service:
    name: fake-hwclock
    enabled: true
    state: started
  become: yes

# --------------------------------------------------
# 7. Interface dummy0 — IP stable pour K3s (pas de câble ethernet)
# --------------------------------------------------
- name: Créer le service systemd dummy0-net (interface dummy virtuelle)
  copy:
    dest: /etc/systemd/system/dummy0-net.service
    mode: '0644'
    content: |
      [Unit]
      Description=Dummy interface {{ dummy_iface }} (stable k3s node-ip {{ node_ip.split('/')[0] }}, no ethernet cable)
      DefaultDependencies=no
      After=network-pre.target
      Before=k3s.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStartPre=-/sbin/modprobe dummy
      ExecStart=-/sbin/ip link add {{ dummy_iface }} type dummy
      ExecStart=/sbin/ip addr flush dev {{ dummy_iface }}
      ExecStart=/sbin/ip addr add {{ node_ip }} dev {{ dummy_iface }}
      ExecStart=/sbin/ip link set {{ dummy_iface }} up
      ExecStop=-/sbin/ip link del {{ dummy_iface }}

      [Install]
      WantedBy=multi-user.target
  become: yes

- name: Activer + démarrer dummy0-net (doit etre UP avant l install k3s)
  service:
    name: dummy0-net
    enabled: true
    state: started
  become: yes

# --------------------------------------------------
# 8. Porte clock-ready — attend une horloge saine avant k3s
# --------------------------------------------------
- name: Créer le script k3s-clock-ready
  copy:
    dest: /usr/local/bin/k3s-clock-ready.sh
    mode: '0755'
    content: |
      #!/bin/sh
      # k3s-clock-ready: attend une horloge saine (annee>=2025) avant k3s.
      # Recharge fake-hwclock a chaque iteration (couvre la synchro RTC tardive).
      # En prod, le telephone (BL-65) pousse l heure via le companion si
      # fake-hwclock n a pas encore de donnee saine (premier boot).
      for i in $(seq 1 300); do
        /sbin/fake-hwclock load 2>/dev/null
        y=$(date +%Y)
        [ "$y" -ge 2025 ] && exit 0
        sleep 2
      done
      exit 1
  become: yes

- name: Créer le service systemd k3s-clock-ready
  copy:
    dest: /etc/systemd/system/k3s-clock-ready.service
    mode: '0644'
    content: |
      [Unit]
      Description=Wait for sane system clock (year>=2025) before k3s (no RTC battery)
      DefaultDependencies=no
      After=local-fs.target
      Before=k3s.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/k3s-clock-ready.sh

      [Install]
      WantedBy=multi-user.target
  become: yes

- name: Activer k3s-clock-ready au boot
  service:
    name: k3s-clock-ready
    enabled: true
  become: yes

- name: Recharger systemd
  command: systemctl daemon-reexec
  become: yes

- name: Créer le dossier K3s pour la config rancher
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
  become: yes

- name: Créer le dossier de stockage K3s
  file:
    path: /data/orin/k3s
    state: directory
    mode: '0755'
  become: yes

- name: Configurer K3s pour Jetson (WiFi-only, interface dummy)
  copy:
    dest: /etc/rancher/k3s/config.yaml
    mode: '0644'
    content: |
      # K3s server configuration for NVIDIA Jetson (WiFi-only)
      token: "JetsonClusterToken"

      node-ip: {{ node_ip.split('/')[0] }}
      advertise-address: {{ node_ip.split('/')[0] }}
      flannel-iface: {{ dummy_iface }}

      # Kubelet configuration for Jetson
      kubelet-arg:
        - "max-pods=110"
        - "kube-reserved=cpu=500m,memory=1Gi"
        - "system-reserved=cpu=500m,memory=512Mi"
        - "eviction-hard=memory.available<200Mi,nodefs.available<5%"
        # Explicit container log rotation — bounds /var/log/containers and
        # /var/log/pods growth. These match kubelet defaults (10Mi x 5 = 50MB
        # per container) but make the bound contractual across versions.
        - "container-log-max-files=5"
        - "container-log-max-size=10Mi"

      # Node labels for GPU workload targeting
      node-label:
        - "device-type=jetson"
        - "accelerator=nvidia-gpu"
        - "nvidia.com/gpu=true"

- name: Create systemd override directory for k3s
  file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: '0755'

# Override k3s : demarrer APRES docker + dummy0 + fake-hwclock + clock-ready
# + rtc-ds3231, et recharger l horloge au tout dernier moment (ExecStartPre via
# k3s-clock-load.sh) pour qu'une synchro RTC tardive (RTC mort -> 1970) ne
# desynchronise pas k3s. k3s-clock-load.sh prefere le DS3231 (detecte
# dynamiquement par driver name 'ds1307' -> /dev/rtcN, N variable car le Jetson
# a deux RTC Tegra onboard ; le DS3231 est typiquement /dev/rtc2, PAS rtc1) et
# retombe sur fake-hwclock si absent.
# Requires= sur dummy0-net + fake-hwclock : `After=` seul n'active PAS la
# dependance, il l'ordonne seulement. Sans Requires=, l'installeur k3s
# (`systemctl start k3s`) ne demarrait pas dummy0-net -> dummy0 absent ->
# k3s plantait "unable to find interface dummy0". Requires= force le demarrage.
# k3s-clock-ready et rtc-ds3231 restent en After= seulement (actives au boot
# via WantedBy= ; ne pas les Requires= pour eviter un hang a l install si
# l horloge n est pas encore syncée / RTC absent).
# --------------------------------------------------
# 8b. k3s-clock-load — wrapper ExecStartPre preferring RTC over fake-hwclock
# --------------------------------------------------
# Runtime detection at k3s start time: find the DS3231 by driver name
# ('ds1307' in /sys/class/rtc/*/device/name) and sync the system clock from
# its /dev/rtcN (N varies — the Jetson has two onboard Tegra RTCs, so the
# DS3231 is typically /dev/rtc2, NOT /dev/rtc1; hardcoding /dev/rtc1 would
# read the onboard Tegra RTC which is stuck at 1970). Falls back to
# fake-hwclock (tertiary) when the DS3231 is absent or not yet registered.
# This avoids templating the override conditionally at install time and
# handles hot-swap of the RTC module.
- name: Créer le script k3s-clock-load (RTC-preferred, fake-hwclock fallback)
  copy:
    dest: /usr/local/bin/k3s-clock-load.sh
    mode: '0755'
    content: |
      #!/bin/sh
      # k3s-clock-load: ExecStartPre for k3s. Prefers the DS3231 RTC and
      # falls back to fake-hwclock when the RTC module is absent or not yet
      # registered. Finds the DS3231 dynamically by driver name (ds1307) so
      # it never reads an onboard Tegra RTC (stuck at 1970). N varies because
      # the Jetson has two onboard Tegra RTCs — the DS3231 is typically
      # /dev/rtc2, NOT /dev/rtc1.
      RTC=""
      for np in /sys/class/rtc/*/device/name; do
        [ -e "$np" ] || continue
        [ "$(cat "$np" 2>/dev/null)" = ds1307 ] || continue
        RTC="/dev/$(basename "$(dirname "$(dirname "$np")")")"
        break
      done
      if [ -n "$RTC" ] && [ -e "$RTC" ]; then
        /sbin/hwclock --hctosys --rtc="$RTC" 2>/dev/null
      else
        /sbin/fake-hwclock load 2>/dev/null
      fi
  become: yes

- name: Configurer l override k3s (dependances + ExecStartPre clock)
  copy:
    dest: /etc/systemd/system/k3s.service.d/override.conf
    mode: '0644'
    content: |
      [Unit]
      After=docker.service dummy0-net.service fake-hwclock.service k3s-clock-ready.service rtc-ds3231.service
      Requires=docker.service dummy0-net.service fake-hwclock.service

      [Service]
      ExecStartPre=/usr/local/bin/k3s-clock-load.sh

- name: Install K3s
  shell: |
    curl -sfL https://get.k3s.io | sudo sh -s - --docker --data-dir=/data/orin/k3s --write-kubeconfig-mode=644 --disable traefik --disable servicelb
  args:
    creates: /usr/local/bin/k3s
    executable: /bin/bash
  tags: k3s

- name: Ensure K3s is running
  systemd:
    name: k3s
    state: started
    enabled: yes
  # On re-runs, docker may have been restarted (e.g. by nvidia-ctk) which
  # stops k3s (Requires=docker.service) without restarting it. (Re)start k3s
  # here so the wait task can reach the API.
  tags: k3s

- name: Wait for K3s node ready
  shell: |
    k3s kubectl get node
  register: result
  retries: 10
  delay: 10
  until: result.rc == 0
  tags: k3s

# --------------/-----------
# INSTALL NVIDIA DEVICE PLUGIN
# -------------------------

- name: Ensure marker directory exists
  file:
    path: /var/lib/countingapp
    state: directory
    mode: '0755'
  tags: nvidia

- name: Copy NVIDIA device plugin manifest (offline)
  copy:
    src: nvidia-device-plugin.yml
    dest: /usr/local/etc/nvidia-device-plugin.yml
    mode: '0644'
  tags: nvidia

- name: Deploy NVIDIA device plugin
  shell: |
    k3s kubectl apply -f /usr/local/etc/nvidia-device-plugin.yml
  args:
    creates: /var/lib/countingapp/nvidia-device-plugin-installed
  tags: nvidia

- name: Mark plugin installed
  file:
    path: /var/lib/countingapp/nvidia-device-plugin-installed
    state: touch
  tags: nvidia
---
- name: Deploy Splash Screen to Jetson
  hosts: all
  become: false  # Run as user, not root
  gather_facts: yes

  vars:
    scripts_dir: "{{ ansible_user_dir }}/scripts"
    splash_image_source: "{{ lookup('ansible.builtin.env', 'PROJECT_ROOT') | default('/mnt/c/Dev/ai/animal-counter') }}/app/img/splash.png"
    app_namespace: "countingapp-dev"
    app_name: "countingapp"

  tasks:
    - name: Display splash screen deployment start
      ansible.builtin.debug:
        msg: "Starting splash screen deployment..."

    # Task 1: Install feh (requires root)
    - name: Install feh image viewer
      become: true
      ansible.builtin.apt:
        name: feh
        state: present
        update_cache: yes
      tags: feh

    # Task 2: Create scripts directory
    - name: Create scripts directory
      ansible.builtin.file:
        path: "{{ scripts_dir }}"
        state: directory
        mode: '0755'
      tags: directory

    # Task 3: Deploy splash display + monitoring script
    - name: Deploy splash screen script
      ansible.builtin.template:
        src: splash-screen.sh.j2
        dest: "{{ scripts_dir }}/splash-screen.sh"
        mode: '0755'
        validate: 'bash -n %s'
      tags: script

    # Task 4: Deploy splash image
    - name: Check if splash image exists locally
      ansible.builtin.stat:
        path: "{{ splash_image_source }}"
      register: splash_image_stat
      delegate_to: localhost

    - name: Copy splash image to Jetson
      ansible.builtin.copy:
        src: "{{ splash_image_source }}"
        dest: "{{ scripts_dir }}/splash-image.png"
        mode: '0644'
      when: splash_image_stat.stat.exists
      tags: image

    - name: Create fallback splash image if source not found
      ansible.builtin.copy:
        content: |
          This is a placeholder. Replace with actual splash image.
          Resolution should be 1024x600 for Jetson display.
        dest: "{{ scripts_dir }}/splash-image.png"
        mode: '0644'
      when: not splash_image_stat.stat.exists
      ignore_errors: yes
      tags: image

    # Task 5: Create XDG autostart desktop entry
    - name: Ensure .config directory exists
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.config"
        state: directory
        mode: '0755'

    - name: Create autostart directory
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.config/autostart"
        state: directory
        mode: '0755'

    - name: Deploy XDG autostart desktop entry
      ansible.builtin.template:
        src: splash-screen.desktop.j2
        dest: "{{ ansible_user_dir }}/.config/autostart/splash-screen.desktop"
        mode: '0644'
      tags: autostart

    # Task 7: Configure kubectl access
    - name: Check if k3s config exists
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: k3s_config_stat
      become: true

    - name: Create .kube directory in user home
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.kube"
        state: directory
        mode: '0700'
      when: k3s_config_stat.stat.exists

    - name: Copy k3s config to user home
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ ansible_user_dir }}/.kube/config"
        mode: '0600'
        remote_src: yes
      become: true
      when: k3s_config_stat.stat.exists
      tags: kubectl

    - name: Set KUBECONFIG in bashrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_user_dir }}/.bashrc"
        line: 'export KUBECONFIG=$HOME/.kube/config'
        mode: '0644'
      when: k3s_config_stat.stat.exists
      tags: kubectl

    - name: Display splash screen deployment completion
      ansible.builtin.debug:
        msg: "Splash screen deployment completed!"
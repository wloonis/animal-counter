---
- name: Prepare Jetson system (up to K3s installation)
  hosts: all
  become: true
  gather_facts: yes

  tasks:
    - name: Display bootstrap start message
      debug:
        msg: "Starting Jetson system preparation..."
      tags: info

    - name: Afficher JETSON_IP
      debug:
        msg: "{{ lookup('env','JETSON_IP') }}"

    - name: Create mount directory
      file:
        path: /data
        state: directory
        mode: '0755'

    # - name: Mount external disk
    #   mount:
    #     path: /data
    #     src: UUID=e50fe815-5682-43e9-aaa5-ff74cd367e34
    #     fstype: ext4
    #     opts: defaults,nofail
    #     state: mounted

    - name: Stop docker
      service:
        name: docker
        state: stopped

    - name: Clean /data/orin directory
      file:
        path: /data/orin
        state: absent

    - name: Recreate /data/orin directory
      file:
        path: /data/orin
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Replace repo version with r36.5
      replace:
        path: /etc/apt/sources.list.d/nvidia-l4t-apt-source.list
        regexp: 'r[0-9]+\.[0-9]+'
        replace: 'r36.5'

    - name: Update APT package cache
      apt:
        update_cache: yes
      ignore_errors: yes
      tags: system_update

    - name: Dist upgrade
      apt:
        upgrade: dist

    # - name: Reboot if needed
    #   reboot:
    #     msg: "Reboot after NVIDIA L4T upgrade"
    #     reboot_timeout: 600

    - name: Install basic utilities
      apt:
        name:
          - nano
          - htop
          - net-tools
          - iftop
          - iotop
          - tmux
          - curl
          - wget
          - git
          - netplan.io
        state: present
      tags: utils

    - name: Import SSH configuration playbook
      import_tasks: network_ssh.yml
      tags: ssh

    - name: Import LXDE installation playbook
      import_tasks: install_lxde.yml
      tags: lxde

    - name: Optimize Jetson system
      block:
        - name: Disable unnecessary services
          systemd:
            name: "{{ item }}"
            enabled: no
            state: stopped
          loop:
            - bluetooth
            - avahi-daemon
            - ModemManager
            - packagekit
            - kerneloops
          tags: optimize

        - name: Disable snapd completely
          systemd:
            name: "{{ item }}"
            enabled: no
            state: stopped
          loop:
            - snapd
            - snapd.socket
          tags: optimize

        # ---------------------------------------------------------------
        # Suppress the desktop popup dialogs that appear on the LXDE
        # autologin session:
        #   - apport: "System program problem detected" (shown by
        #     apport-gtk when /var/crash/*.crash reports exist +
        #     /etc/default/apport enabled=1). nvargus-daemon and other
        #     Jetson daemons occasionally segfault (known Argus stack
        #     instability); these crashes are non-fatal (the daemon
        #     restarts) but the popup is intrusive on a kiosk/prod box.
        #   - update-notifier: "Updates available" (desktop autostart app
        #     fed by the apt-daily timers). On a pinned Jetson L4T image
        #     apt upgrades are done explicitly during deploy, never via
        #     the desktop popup.
        # ---------------------------------------------------------------
        - name: Disable + mask apport (crash-report popups)
          systemd:
            name: apport
            enabled: no
            state: stopped
            masked: yes
          ignore_errors: yes
          tags: optimize

        - name: Disable apport via /etc/default/apport (apport-gtk guard)
          copy:
            dest: /etc/default/apport
            content: "enabled=0\n"
            mode: '0644'
          tags: optimize

        - name: Clean stale crash reports (so the dialog does not reappear post-deploy)
          shell: rm -f /var/crash/*.crash
          args:
            removes: /var/crash
          changed_when: false
          tags: optimize

        - name: Disable apt-daily timers (no background "updates available" checks)
          systemd:
            name: "{{ item }}"
            enabled: no
            state: stopped
          loop:
            - apt-daily.timer
            - apt-daily-upgrade.timer
          ignore_errors: yes
          tags: optimize

        - name: Mask update-notifier desktop autostart (suppress "updates available" popup)
          file:
            path: /etc/xdg/autostart/update-notifier.desktop
            state: absent
          ignore_errors: yes
          tags: optimize

        - name: Set Jetson to MAXN mode (Super Orin)
          command: sudo nvpmodel -m 2
          tags: optimize

        - name: Enable maximum CPU/GPU clocks
          command: sudo jetson_clocks
          tags: optimize

# -------------------------------------------------------------------
# Import the DS3231 RTC playbook as its own play. `configure_rtc.yml` is a
# standalone, directly-runnable playbook (it carries its own
# `hosts: all` / `become: true` / `gather_facts: yes` header + vars +
# handlers, like the companion deploy playbook in the sister repo), so it
# must be pulled in with
# `import_playbook` (which expands a full play) rather than `import_tasks`
# (which only accepts a flat tasks list). It runs BEFORE the k3s import
# below so the `rtc-ds3231.service` boot unit is installed before the k3s
# clock stack is configured (Task 3 reworks k3s ExecStartPre to prefer
# /dev/rtc1 and falls back to fake-hwclock when the RTC is absent).
# -------------------------------------------------------------------
- import_playbook: configure_rtc.yml
  tags: rtc

- name: Prepare Jetson system (K3s installation)
  hosts: all
  become: true
  gather_facts: yes

  tasks:
    - name: Import k3s installation playbook (Jetson optimized)
      import_tasks: install_k3s_with_docker_tasks.yml
      tags: k3s

    - name: Display system preparation completion message
      debug:
        msg: "Jetson system preparation completed successfully!"
      tags: info


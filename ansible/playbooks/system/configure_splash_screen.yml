---
# configure_splash_screen.yml
#
# Ultra-minimal splash-screen configuration for the Jetson target.
#
# What it does:
#   1. Installs the `feh` image viewer (apt).
#   2. Creates /opt/splash-screen and copies the local splash.png into it.
#   3. Drops a ~/.config/autostart/splash.desktop file that runs
#      `feh --fullscreen --hide-pointer /opt/splash-screen/splash.png`
#      at every LXDE login.
#   4. Installs a one-shot systemd timer that runs `pkill feh`
#      splash_duration seconds after boot, so feh is gone before it
#      can sit on top of the countingapp window for too long.
#
# No LightDM override, no Plymouth, no splash-guard script, no k3s
# readiness polling, no HTTP healthcheck. The countingapp window
# already paints over the splash once it comes up; the timer just
# guarantees feh disappears after a fixed delay as a clean-up.
#
# Pre-requisites (validated by pre_tasks below):
#   - LOCAL_APP_PATH must be exported in the environment (normally done by
#     scripts/install_splash_screen_standalone.sh via `source .env.local`).
#   - ${LOCAL_APP_PATH}/img/splash.png must exist on the controller.
#
# Usage:
#   ansible-playbook -i ansible/inventory/jetsons.yml \
#                    ansible/playbooks/system/configure_splash_screen.yml

- name: Configure Splash Screen (ultra-minimal, autostart + timer)
  hosts: all
  become: true
  gather_facts: yes

  vars:
    splash_image_filename: splash.png
    splash_image: /opt/splash-screen/splash.png

    # How long feh stays on screen before being killed by the systemd
    # timer. 45s is more than enough on a single-node Jetson for the
    # countingapp window to paint over the splash.
    splash_duration: 45

    # k3s workload name (kept here so the .env.local variables are
    # documented in one place; the value is not consumed by the
    # .desktop or the timer).
    app_namespace: "{{ lookup('env', 'APP_NAMESPACE') | default('countingapp-dev', true) }}"
    app_name: "{{ lookup('env', 'APP_NAME')     | default('countingapp',     true) }}"

    # Controller-side path to the local app/ directory (NOT on the Jetson).
    local_app_path: "{{ lookup('env', 'LOCAL_APP_PATH') | default('./app', true) }}"
    local_splash_image: "{{ local_app_path }}/img/{{ splash_image_filename }}"

    # Target user for the autostart .desktop. Defaults to the ansible_user
    # (typically 'nano-counter' from the inventory) so the file lands in the
    # home directory of whoever LXDE autologs in.
    target_user: "{{ ansible_user | default('jetson') }}"
    target_user_home: "/home/{{ target_user }}"
    autostart_dir: "{{ target_user_home }}/.config/autostart"
    autostart_desktop: "{{ autostart_dir }}/splash.desktop"

  pre_tasks:
    - name: Verify LOCAL_APP_PATH environment variable is set
      become: false
      delegate_to: localhost
      run_once: true
      fail:
        msg: >-
          LOCAL_APP_PATH environment variable is not defined.
          Export it from .env.local before running ansible-playbook, e.g.:
            set -a; source .env.local; set +a
      when: lookup('env', 'LOCAL_APP_PATH') | default('', true) | length == 0

    - name: Verify splash.png exists on the controller
      become: false
      delegate_to: localhost
      run_once: true
      stat:
        path: "{{ local_splash_image }}"
      register: splash_image_stat

    - name: Fail if splash.png is missing
      become: false
      delegate_to: localhost
      run_once: true
      fail:
        msg: >-
          splash image not found at {{ local_splash_image }}.
          Check that LOCAL_APP_PATH points to the directory containing img/splash.png.
      when: not splash_image_stat.stat.exists

  tasks:
    # -------------------------------------------------------------------
    # 1. Install feh (image viewer used by the .desktop)
    # -------------------------------------------------------------------
    - name: Install feh
      apt:
        name: feh
        state: present
        update_cache: yes
        cache_valid_time: 3600

    # -------------------------------------------------------------------
    # 2. Create /opt/splash-screen and copy splash.png
    # -------------------------------------------------------------------
    - name: Create /opt/splash-screen
      file:
        path: /opt/splash-screen
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy splash.png to /opt/splash-screen
      copy:
        src: "{{ local_splash_image }}"
        dest: "{{ splash_image }}"
        owner: root
        group: root
        mode: '0644'

    # -------------------------------------------------------------------
    # 3. Install a one-shot systemd service + timer that pkill feh
    #    splash_duration seconds after boot.
    # -------------------------------------------------------------------
    - name: Install countingapp-splash-killer.service
      copy:
        dest: /etc/systemd/system/countingapp-splash-killer.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Kill the splash feh process once the splash_duration has elapsed
          After=graphical.target

          [Service]
          Type=oneshot
          # Kill feh processes running the splash image. pkill -f matches
          # against the full command line. The `|| true` makes the unit
          # succeed even if no feh is running anymore.
          ExecStart=/usr/bin/pkill -f 'feh.*splash-screen/splash.png' || true
          # Fallback: kill any feh instance owned by the target user, in
          # case the path matching above misses (e.g. feh was restarted
          # with a different cwd).
          ExecStart=/usr/bin/pkill -u {{ target_user }} -x feh || true

    - name: Install countingapp-splash-killer.timer
      copy:
        dest: /etc/systemd/system/countingapp-splash-killer.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Fire the splash killer {{ splash_duration }}s after boot
          After=graphical.target

          [Timer]
          OnBootSec={{ splash_duration }}s
          AccuracySec=1s
          Unit=countingapp-splash-killer.service

          [Install]
          WantedBy=timers.target

    - name: Enable and start countingapp-splash-killer.timer
      systemd:
        name: countingapp-splash-killer.timer
        enabled: yes
        state: started
        daemon_reload: yes

    # -------------------------------------------------------------------
    # 4. Drop the LXDE autostart .desktop for the target user
    # -------------------------------------------------------------------
    - name: Ensure ~/.config/autostart exists
      file:
        path: "{{ autostart_dir }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    - name: Install splash.desktop in autostart
      copy:
        dest: "{{ autostart_desktop }}"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Splash Screen
          # Show splash.png fullscreen at LXDE login. feh is killed
          # {{ splash_duration }} seconds after boot by the
          # countingapp-splash-killer.service systemd unit, so it
          # does not stay on top of the countingapp window.
          Exec=/usr/bin/feh --fullscreen --hide-pointer {{ splash_image }}
          NoDisplay=true
          X-GNOME-Autostart-enabled=true

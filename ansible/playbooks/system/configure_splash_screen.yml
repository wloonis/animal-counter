---
- name: Configure Splash Screen and LXDE Protection
  hosts: all
  become: true
  gather_facts: yes

  vars:
    splash_image: splash.png
    local_app_img_path: ./app/img
    app_namespace: "{{ lookup('env', 'APP_NAMESPACE') | default('countingapp-dev', true) }}"
    app_name: "{{ lookup('env', 'APP_NAME') | default('countingapp', true) }}"
    splash_service_name: countingapp-splash-guard
    splash_script_path: /usr/local/bin/countingapp-splash-guard.sh
    splash_lock_file: /var/run/countingapp-splash.lock
    lightdm_config_dir: /etc/lightdm/lightdm.conf.d

  tasks:
    # =========================================================================
    # Task 1: Create necessary directories
    # =========================================================================
    - name: Create splash screen directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/splash-screen
        - "{{ lightdm_config_dir }}"

    # =========================================================================
    # Task 2: Copy splash.png to Jetson
    # =========================================================================
    - name: Copy splash.png to Jetson
      copy:
        src: "{{ local_app_img_path }}/{{ splash_image }}"
        dest: /opt/splash-screen/{{ splash_image }}
        mode: '0644'
      delegate_to: localhost

    # =========================================================================
    # Task 3: Create the splash guard monitoring script
    # =========================================================================
    - name: Create splash guard monitoring script
      copy:
        dest: "{{ splash_script_path }}"
        mode: '0755'
        content: |
          #!/bin/bash
          # Splash screen guard script
          # Monitors countingapp service in k3s and controls LightDM access
          
          # Configuration
          LOCK_FILE="{{ splash_lock_file }}"
          SERVICE_NAME="{{ app_name }}"
          NAMESPACE="{{ app_namespace }}"
          K3S_BINARY="/usr/local/bin/k3s"
          # Set KUBECONFIG for kubectl access to k3s cluster
          export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"
          LIGHTDM_CONFIG_DIR="{{ lightdm_config_dir }}"
          SPLASH_IMAGE="/opt/splash-screen/{{ splash_image }}"
          NORMAL_CONFIG="${LIGHTDM_CONFIG_DIR}/50-spring.conf"
          SPLASH_CONFIG="${LIGHTDM_CONFIG_DIR}/60-splash-lock.conf"
          
          # Log function
          log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a /var/log/countingapp-splash.log
          }
          
          # Function to enable splash lock mode
          enable_splash_lock() {
              log "ENABLING splash lock mode - countingapp not ready"
              touch "$LOCK_FILE"
              
              # Configure LightDM to show splash image as greeter background
              cat > "${SPLASH_CONFIG}" << 'EOF'
          [Seat:*]
          greeter-background = /opt/splash-screen/splash.png
          greeter-hide-users = false
          greeter-show-manual-login = true
          allow-guest = false
          EOF
              
              # Restart LightDM to apply changes
              systemctl restart lightdm
          }
          
          # Function to disable splash lock mode
          disable_splash_lock() {
              log "DISABLING splash lock mode - countingapp is ready!"
              rm -f "$LOCK_FILE"
              
              # Restore normal LightDM configuration
              if [ -f "${SPLASH_CONFIG}" ]; then
                  rm -f "${SPLASH_CONFIG}"
              fi
              
              # Restart LightDM to apply normal configuration
              systemctl restart lightdm
          }
          
          # Function to check if countingapp is running in k3s
          check_countingapp_status() {
              # Run kubectl via k3s with sudo to ensure proper permissions
              if sudo -n $K3S_BINARY kubectl get pod -n "$NAMESPACE" -l app="$SERVICE_NAME" --no-headers 2>/dev/null | grep -q "Running"; then
                  return 0
              fi
              # Fallback: try without sudo (might work depending on k3s config)
              if $K3S_BINARY kubectl get pod -n "$NAMESPACE" -l app="$SERVICE_NAME" --no-headers 2>/dev/null | grep -q "Running"; then
                  return 0
              fi
              return 1
          }
          
          # Main loop
          log "Starting splash guard monitoring..."
          
          # Check initial state
          if check_countingapp_status; then
              log "countingapp is already running - normal mode"
              disable_splash_lock
          else
              log "countingapp is not running - enabling splash lock"
              enable_splash_lock
          fi
          
          # Continuous monitoring loop
          while true; do
              sleep 10
              
              if check_countingapp_status; then
                  if [ -f "$LOCK_FILE" ]; then
                      disable_splash_lock
                  fi
              else
                  if [ ! -f "$LOCK_FILE" ]; then
                      enable_splash_lock
                  fi
              fi
          done

    # =========================================================================
    # Task 4: Create systemd service for splash guard
    # =========================================================================
    - name: Create splash guard systemd service
      copy:
        dest: /etc/systemd/system/{{ splash_service_name }}.service
        mode: '0644'
        content: |
          [Unit]
          Description=Splash Screen Guard - Blocks LXDE until countingapp is ready
          After=lightdm.service k3s.service
          Wants=k3s.service
          
          [Service]
          Type=simple
          ExecStart={{ splash_script_path }}
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target

    # =========================================================================
    # Task 5: Enable and start the splash guard service
    # =========================================================================
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable splash guard service
      systemd:
        name: "{{ splash_service_name }}"
        enabled: yes
        state: started

    # =========================================================================
    # Task 6: Optionally configure a custom greeter for better splash experience
    # =========================================================================
    - name: Install feh for wallpaper display (optional)
      apt:
        name: feh
        state: present
      ignore_errors: yes

    - name: Create alternative splash script using X11
      copy:
        dest: /usr/local/bin/countingapp-splash-x11.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Alternative splash screen using fbi or nitrogen
          # This displays splash.png on virtual terminal during boot
          
          SPLASH_IMAGE="/opt/splash-screen/splash.png"
          
          # Install fbi if not present (for framebuffer)
          if ! command -v fbi &> /dev/null; then
              apt-get update && apt-get install -y fbi
          fi
          
          # Show splash on framebuffer tty1
          # This will show during boot before X11 starts
          if [ -f "$SPLASH_IMAGE" ]; then
              # Use fbi to show image on tty1
              fbi -T 1 -d /dev/fb0 --noverbose "$SPLASH_IMAGE" &
          fi

    # =========================================================================
    # Task 7: Display completion message
    # =========================================================================
    - name: Display splash screen configuration complete
      debug:
        msg: |
          ============================================================
          Splash Screen Configuration Complete!
          ============================================================
          
          The splash screen system has been configured to:
          - Display /opt/splash-screen/splash.png while countingapp loads
          - Block LXDE/LightDM access until countingapp is running in k3s
          - Automatically unlock when countingapp pod is in Running state
          
          Service status:
          - Service name: {{ splash_service_name }}
          - Monitoring script: {{ splash_script_path }}
          - Lock file: {{ splash_lock_file }}
          
          To check status:
            systemctl status {{ splash_service_name }}
            journalctl -u {{ splash_service_name }} -f
          
          To manually trigger splash lock:
            touch {{ splash_lock_file }}
            systemctl restart lightdm
          
          To manually release splash lock:
            rm -f {{ splash_lock_file }}
            systemctl restart lightdm
          ============================================================
      tags: info
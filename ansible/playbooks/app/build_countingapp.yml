---
- name: Set build variables from environment
  set_fact:
    app_path: "{{ lookup('env', 'APP_PATH') | default('/data/orin/git/animal-counting/app', true) }}"
    image_name: "{{ lookup('env', 'IMAGE_NAME') | default('countingapp', true) }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('local', true) }}"
  tags: build

- name: Create application directory on Jetson
  file:
    path: "{{ app_path }}"
    state: directory
    mode: '0775'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: yes
  tags: build

- name: Copy application files to Jetson
  command: >
    rsync -avz --delete --no-owner --no-group --exclude='__pycache__' --exclude='*.pyc'
    --exclude='model/old/'
    -e "sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    ../../../app/
    {{ ansible_user }}@{{ ansible_host }}:{{ app_path }}
  environment:
    SSHPASS: "{{ ansible_become_password }}"
  delegate_to: localhost
  become: false
  tags: build

- name: Check if Docker image already exists
  command: docker image inspect {{ image_name }}:{{ image_tag }}
  register: app_image
  changed_when: false
  failed_when: false
  tags: build2

- name: Capture git commit SHA from the app checkout on Jetson
  command: git rev-parse HEAD
  args:
    chdir: "{{ app_path }}"
  register: git_commit_sha
  changed_when: false
  tags: build2

- name: Build Docker image
  shell: |
    cd {{ app_path }} && 
    docker buildx build \
      --build-arg IMAGE_TAG={{ image_tag }} \
      --build-arg GIT_COMMIT={{ git_commit_sha.stdout }} \
      -t {{ image_name }}:{{ image_tag }} .
    docker image prune -f && docker builder prune -f
  # Skip if the image already exists (avoid a long rebuild on every
  # prepare_jetson.sh re-run). App code changes are rsync'd to the hostPath
  # mount and picked up live — only dependency changes (requirements.txt etc.)
  # need a rebuild, in which case run with `-e force_rebuild=true`.
  when: app_image.rc != 0 or (force_rebuild | default(false) | bool)
  tags: build2
#    docker buildx build --no-cache -t {{ image_name }}:{{ image_tag }} .




# PI-Optimized Fix GitHub Issue Workflow
# Uses PI + Ollama/minimax-m2.5
name: pi-fix-issue
description: |
  Fix, resolve, or implement a solution for a GitHub issue using PI + Ollama.
  
  Use when: You want to fix a specific issue.
  
  NOT for: Comprehensive multi-agent reviews.
  NOT for: Questions about issues.
  
  Workflow:
  1. Classify the issue (bug/feature/enhancement)
  2. Research context (codebase exploration)
  3. Implement the fix
  4. Validate the solution

provider: pi
model: ollama/minimax-m2.5:cloud
effort: high

nodes:
  - id: classify-issue
    prompt: |
      # Fix Issue — Classification
      
      Analyze the issue to classify:
      1. Type: bug, feature, enhancement, or other
      2. Severity: critical, high, medium, low
      3. Area: frontend, backend, database, config, etc.
      4. Files likely affected
      
      Input: $ARGUMENTS (issue number or description)
      
      Report classification.
    allowed_tools: [read, grep, find, ls, bash]
    denied_tools: []

  - id: research
    depends_on: [classify-issue]
    prompt: |
      # Fix Issue — Research
      
      Research the issue context:
      1. Explore the codebase to understand relevant code
      2. Find similar patterns to follow
      3. Identify what needs to change
      
      Gather enough context to implement the fix.
    allowed_tools: [read, grep, find, ls, bash]
    denied_tools: []

  - id: implement-fix
    depends_on: [research]
    prompt: |
      # Fix Issue — Implementation
      
      Implement the fix based on research:
      1. Make the necessary code changes
      2. Add tests if applicable
      3. Verify the fix compiles/works
      
      Implement directly - don't just report issues.
    allowed_tools: [read, write, edit, grep, find, ls, bash]
    denied_tools: []

  - id: validate-fix
    depends_on: [implement-fix]
    prompt: |
      # Fix Issue — Validation
      
      Validate the fix:
      1. Run any available tests
      2. Verify syntax/compilation
      3. Check that the fix addresses the issue
      
      Report validation results.
    allowed_tools: [read, bash, grep, ls]
    denied_tools: []

  - id: summarize
    depends_on: [validate-fix]
    prompt: |
      # Fix Issue — Summary
      
      Summarize what was done:
      1. Issue description
      2. Root cause (if identified)
      3. Fix implemented
      4. How to verify the fix
      
      Output to $ARTIFACTS_DIR/issue-fix.md
    allowed_tools: [read, write, grep]
    denied_tools: []
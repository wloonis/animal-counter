name: update-docs
description: Update documentation files in docs/ to reflect the Animal Counter Application using Pi + Ollama/minimax-m2.5
provider: pi
model: ollama/minimax-m2.5:cloud
# Thinking effort: low (faster), medium, high, max (deep reasoning)
effort: high

nodes:
  - id: update-quickstart
    prompt: |
      Rewrite docs/01_quickstart.md to be the Quick Start Guide for the Animal Counter Application.
      
      The Animal Counter Application is a real-time animal counting system using:
      - YOLO26 with TensorRT inference on Jetson Orin
      - OCSORT tracker for object tracking
      - Multi-threaded architecture (Inference Thread + Display Thread)
      - K3s Kubernetes deployment
      - FileBrowser for video management
      - Ansible for automated deployment
      
      Include these sections:
      - Overview
      - Prerequisites (Hardware: Jetson Orin, Camera; Software: JetPack 6.1+, Python 3.10+, TensorRT)
      - Quick Start Steps
      - Running the Application
      - Troubleshooting tips
      
      Keep it concise and practical for technicians. Write in English.
    allowed_tools: [read, write, grep, ls, bash]
    denied_tools: []

  - id: update-deployment
    prompt: |
      Rewrite docs/deployment_guide.md to be a comprehensive Deployment Guide for the Animal Counter Application.
      
      Include all these topics:
      - Overview
      - Prerequisites (Hardware/Software)
      - Installation via Ansible (full process with playbooks)
      - K3s Deployment (Deployment, Service, ConfigMap, Secret, FileBrowser, CronJob)
      - Configuration (all env vars)
      - Running the application (command line args)
      - Testing
      - Troubleshooting
      
      Make it detailed and complete. Write in English.
    allowed_tools: [read, write, grep, ls, bash]
    denied_tools: []
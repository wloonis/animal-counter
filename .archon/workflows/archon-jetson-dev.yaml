# Jetson-gated autonomous development workflow with business validation.
#
# Flow: Archon asks clarifying questions → Pi session writes PLAN.md and submits
# via @plannotator/pi-extension → human reviews and approves over HTTP on
# 127.0.0.1:19432 → Pi implements task-by-task with py_compile validation →
# Pi runs scripts/validate_on_jetson.sh on the Jetson → parses JSON report →
#   - pass → docs-sync (sync README/docs to the changed surface) → finalize (push + PR draft)
#   - count_mismatch → HITL PAUSE (no auto-fix — anti metric-gaming)
#   - execution_error → auto-diagnose + fix + retry (limited by max_iterations)
#
# This workflow is Python/Jetson-specific. It does NOT use bun run validate /
# bun run type-check (those are JS/TS patterns that don't exist in this project).
# The validation criterion is the counting result on the reference video
# (configured in validation/config.json; expected_count derived from filename).
#
# Relay protocol (detached runs): the workflow is launched with `--detach` and
# surfaces its state to a relay agent via small beacon files written to
# `.archon-relay/` in the worktree (CLARIFY.md, PLANNOTATOR.md, VALIDATION.md).
# The relay agent polls `archon workflow get <run-id> --json --verbose` for
# status/gate and feeds user replies back via `archon workflow approve <run-id>
# "<feedback>"`. See AGENTS.md for the full protocol.
#
# Prereqs (one-time per machine):
#   pi install npm:@plannotator/pi-extension
#   .archon/config.yaml must have extensionFlags.plan: true + PLANNOTATOR_REMOTE: "1"

name: archon-jetson-dev
description: |
  Use when: You want autonomous development with Jetson-based business validation.
  The app runs on a Jetson Orin in k3s; validation = running a reference video
  and comparing the pig count to the expected value (derived from the filename).
  Triggers: "jetson dev", "validate on jetson", "autonomous dev pipeline",
            "jetson validation", "business validation".
  NOT for: Standard PIV without Jetson validation (use archon-plannotator-piv).
  NOT for: Quick fixes, PR reviews, JS/TS projects.

  Seven phases:
  1. CLARIFY: Pi asks 2-3 targeted questions, converges on intent.
  2. PLAN: Pi writes PLAN.md and submits via plannotator HTTP UI.
  3. VERIFY-PLAN: Bash sanity check that PLAN.md exists with tasks.
  4. IMPLEMENT: Pi reads approved PLAN.md, executes task-by-task with
     python3 -m py_compile validation + commits.
  5. JETSON-VALIDATE: Pi runs scripts/validate_on_jetson.sh, parses the JSON
     report, and handles three outcomes:
     - pass → signal VALIDATED → proceed to docs-sync
     - count_mismatch → HITL PAUSE (user guides the fix — no auto-correction)
     - execution_error → auto-diagnose + fix + retry (limited by max_iterations
       from validation/config.json; escalate to HITL if exceeded)
  6. DOCS-SYNC: Fresh Pi session syncs README.md, AGENTS.md, docs/**, and
     ansible/README.md to the changed surface (paths, symbols, env vars,
     hostPaths, contracts) so no doc references the pre-change state. Runs
     AFTER validation PASS so docs match validated code. Autonomous (no human
     gate); the relay surfaces the doc commit. Flags shared/contract docs
     (e.g. docs/IPC_CONTRACT.md) whose sister-repo copy must be resynchronized.
  7. FINALIZE: Push branch + create draft PR on GitHub.

provider: pi
model: ollama/glm-5.2
interactive: true

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: CLARIFY — Converge on intent (user decisions pre-resolved)
  # ═══════════════════════════════════════════════════════════════

  - id: clarify
    loop:
      prompt: |
        # Jetson Dev — Clarify Phase

        You are about to hand off to a Pi session that will write a plan and
        submit it through plannotator's HTTP approval UI. Before that handoff,
        get enough clarity that the Pi agent can produce a useful plan.

        **User's request**: $ARGUMENTS
        **User's latest reply**: $LOOP_USER_INPUT

        ---

        ## If this is the FIRST iteration (no reply yet):

        1. **Do light codebase recon** — grep/Read for the obvious touch points.
           Focus on: app/src/main.py, app/entrypoint.sh, k3s/templates/,
           scripts/, validation/, .archon/workflows/.
        2. **Output your understanding + 2-3 questions**, max:

           ```
           ## What I understand
           {1-2 sentences restating the request}

           ## What I found
           - `{file:line}` — {how it relates}
           - `{file:line}` — {how it relates}

           ## Questions before I hand off to plannotator
           1. {targeted decision question — reference real code}
           2. {targeted decision question}
           3. {optional third question}
           ```

        Ask about **decisions** (scope boundary, extend-vs-new, testing bar),
        not information you can look up. If you genuinely have no questions,
        say so and ask them to confirm you're ready to proceed.

        ---

        ## If the user has replied (subsequent iterations):

        Parse their answers.

        ### If there's still a real ambiguity
        Ask ONE follow-up question. Do NOT emit the signal.

        ### If you're converging but not yet approved
        Summarize the resolved intent and ask for confirmation:

        ```
        ## Ready for plannotator

        **Building**: {clear 1-2 sentence description}
        **In scope**: {bullets}
        **Out of scope**: {bullets}
        **Key decisions**: {bullets}
        **Files likely to change**: {bullets}
        ```

        Tell them: "Say **ready** to hand off to plannotator, or reply with
        any last adjustments." Do NOT emit the signal yet.

        ### If they approved ("ready", "go", "let's do it", "proceed", "approved")

        **Restate the FULL resolved intent one last time, then emit the signal
        in the SAME response.** This output becomes `$clarify.output`, which is
        the ONLY intent the planner receives — it does NOT see `$ARGUMENTS` or
        your earlier iterations. If you emit the signal alone (without the
        intent block), the planner falls back to the original request and the
        clarified decisions are lost. So your approval response MUST be:

        ```
        ## Resolved intent for plannotator

        **Building**: {clear 1-2 sentence description}
        **In scope**: {bullets}
        **Out of scope**: {bullets}
        **Key decisions**: {bullets}
        **Files likely to change**: {bullets}
        ```

        `<promise>READY_FOR_PLAN</promise>`

        ---

        ## Signal rules (READ CAREFULLY)

        - ONLY emit `<promise>READY_FOR_PLAN</promise>` when the user's latest
          message contains explicit approval ("ready", "go", "let's do it",
          "proceed", "approved") **AND** you have just restated the full
          resolved intent block in the same response.
        - A question or any revision request = do NOT emit the signal.
        - If you're unsure whether it's approval, ask — do NOT emit the signal.
        - NEVER emit the signal as a standalone line without the intent block
          above it — `$clarify.output` must carry the resolved intent to the
          planner, or it silently reverts to `$ARGUMENTS`.

        ---

        ## Relay beacon (REQUIRED every iteration)

        This workflow runs detached (no live TTY). A relay agent surfaces your
        state to the user by reading a file. After printing your output above,
        use the write tool to create/overwrite `.archon-relay/CLARIFY.md`:

        ```
        STATE: WAITING_FOR_USER
        ITERATION: <n>
        QUESTIONS:
        <your questions verbatim, or: None — confirm "ready" to proceed>
        INTENT: <one-line intent summary>
        ```

        Write it on every iteration (the relay agent polls this file). When you
        are about to emit READY_FOR_PLAN, first overwrite it with
        `STATE: READY_FOR_PLAN` so the relay knows CLARIFY is done. The write
        tool creates the `.archon-relay/` directory automatically.
      until: READY_FOR_PLAN
      max_iterations: 6
      interactive: true
      gate_message: |
        My questions are in `.archon-relay/CLARIFY.md`. Answer them, push back on
        the scoping, or say "ready" to hand off to plannotator for plan review.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: PLAN — Pi session submits plan via plannotator
  # Human approves/denies over HTTP on 127.0.0.1:19432.
  # ═══════════════════════════════════════════════════════════════

  - id: plannotator-plan
    depends_on: [clarify]
    provider: pi
    model: ollama/glm-5.2
    idle_timeout: 3600000
    prompt: |
      # Jetson Dev — Plan Phase (PLANNING ONLY)

      ╔══════════════════════════════════════════════════════════════╗
      ║  ⚠  YOU ARE A PLANNER. YOU ARE NOT AN IMPLEMENTER.           ║
      ║                                                              ║
      ║  Your ENTIRE job is:                                         ║
      ║    1. Write PLAN.md                                          ║
      ║    2. Submit it via plannotator_submit_plan                  ║
      ║    3. Iterate on PLAN.md if denied                           ║
      ║    4. On approval → PRINT ONE LINE AND EXIT                  ║
      ║                                                              ║
      ║  You will NEVER:                                             ║
      ║    • Edit any file other than PLAN.md                        ║
      ║    • Run bash, agent_browser, cron_create, or any tool that  ║
      ║      inspects or modifies source code                        ║
      ║    • "Get a head start" on implementation after approval     ║
      ║    • Open a browser, start a dev server, or run tests        ║
      ║                                                              ║
      ║  A downstream node (PI) handles ALL implementation.          ║
      ║  If you start coding here, you are WRONG and the workflow    ║
      ║  will fail.                                                  ║
      ╚══════════════════════════════════════════════════════════════╝

      **Resolved intent from the clarify phase**:
      $clarify.output

      > ⚠ The block above is the ONLY intent you receive — you do NOT see
      > `$ARGUMENTS` or earlier clarify iterations. If it does not contain a
      > "Resolved intent for plannotator" / "Ready for plannotator" block with
      > In scope / Out of scope / Key decisions, STOP and print
      > "CLARIFY→PLAN HANDOFF BROKEN: $clarify.output did not restate the intent."
      > Do NOT fall back to guessing the original request.

      ---

      ## Step 1: Write PLAN.md

      Use the write tool on `PLAN.md` (and ONLY that file). Structure:

      ```markdown
      # Plan: {feature name}

      ## Summary
      {1-2 sentences — what and why}

      ## In Scope
      - {bullet}
      ## Out of Scope
      - {bullet}

      ## Architecture Decisions
      - {decision — rationale}

      ## Tasks
      - [ ] Task 1: {ACTION} `{path}` — {what and why}
      - [ ] Task 2: {ACTION} `{path}` — {what and why}
      - [ ] Task N: {ACTION} `{path}` — {what and why}

      ## Documentation Impact
      - {docs that reference the changed paths/symbols/env vars/contracts —
         grep README.md, AGENTS.md, docs/**/*.md, ansible/README.md for stale
         references to anything your tasks rename/move/remove; list each doc
         + what goes stale. The downstream docs-sync phase re-verifies this,
         but enumerate it here so the plan is doc-aware from the start.}

      ## Validation
      - {command(s) that prove the feature works}

      ## Risks
      - {risk} — {mitigation}
      ```

      Every task must be atomic, name a specific file, and describe a
      verifiable action. You may READ CLAUDE.md and README.md for conventions,
      but do NOT read or edit any source files. For the **Documentation
      Impact** section, grep the docs for references to any path/symbol/env
      var/contract your tasks change (renamed paths, moved hostPaths, renamed
      settings, removed env vars, changed IPC files) and list each stale doc
      — the docs-sync phase is the safety net, but the plan must be doc-aware.

      ## Step 2: Submit for review

      Call `plannotator_submit_plan`. The tool will emit a review URL
      (127.0.0.1:19432) via notify(). Wait for the reviewer's decision.

      ## Step 3: Handle the reviewer's decision

      ### Approved
      Print exactly: `PLAN APPROVED — handing off to implement node.`
      Exit. Do NOT start implementing.

      > Plan approval is a **HUMAN gate**. Only the user approves/denies via
      > the plannotator browser UI at 127.0.0.1:19432. You (the planner) and the
      > relay agent NEVER approve the plan — you only WAIT for the user's
      > decision. The relay must surface the URL and tell the user to
      > approve/deny; it must NOT click Approve/Deny on the user's behalf.

      ### Denied with feedback
      Use the edit tool on `PLAN.md` to address the feedback, then call
      `plannotator_submit_plan` again. Repeat until approved.

      ## Step 4: Relay beacon (REQUIRED on every submission)

      This workflow runs detached (no live TTY). A relay agent must tell the
      user where to review the plan. IMMEDIATELY after every
      `plannotator_submit_plan` call (including re-submissions after denial),
      use the write tool to create/overwrite `.archon-relay/PLANNOTATOR.md`:

      ```
      STATE: PLAN_REVIEW_PENDING
      URL: http://127.0.0.1:19432
      PLAN_FILE: PLAN.md
      ```

      The user opens that URL in a browser to approve or deny. On approval,
      overwrite it with `STATE: PLAN_APPROVED` then exit. The write tool
      creates the `.archon-relay/` directory automatically.

      ## Rules (non-negotiable)

      - PLAN.md and `.archon-relay/PLANNOTATOR.md` are the ONLY files you may
        create or edit.
      - The only files you may READ are: PLAN.md, CLAUDE.md, README.md.
      - Do NOT call bash, agent_browser, cron_create, or any tool that
        inspects, modifies, or executes source code.
      - After approval, do NOT start implementing.
      - **Plan approval is a HUMAN gate.** Only the user approves/denies via
        the plannotator browser. Never auto-approve; the relay must never
        approve/deny on the user's behalf — only surface the review URL.
      - Once the user approves, the approved PLAN.md is auto-archived to the
        main repo's `plans/PR_<slug>.md` by the downstream `verify-plan` node
        (no action needed from you).

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2b: VERIFY — Sanity check the approved plan landed on disk
  # ═══════════════════════════════════════════════════════════════

  - id: verify-plan
    depends_on: [plannotator-plan]
    bash: |
      if [ ! -f PLAN.md ]; then
        echo "FAIL: PLAN.md was not created — plannotator planning phase did not produce a plan"
        exit 1
      fi
      if ! grep -qE '^- \[.\]' PLAN.md; then
        echo "FAIL: PLAN.md has no task checkboxes — incomplete plan"
        cat PLAN.md
        exit 1
      fi
      task_count=$(grep -cE '^- \[.\]' PLAN.md)
      echo "PASS: PLAN.md has $task_count task(s)"
      cp PLAN.md "$ARTIFACTS_DIR/PLAN.md"

      # Archive the APPROVED plan into the main repo's plans/ dir as PR_<slug>.md.
      # The plan is only approved at this point (plannotator-plan exits solely on
      # user approval), so PLAN.md is the final, user-validated version.
      MAIN=$(git worktree list --porcelain | awk '/^worktree /{print $2; exit}')
      mkdir -p "$MAIN/plans"
      TITLE=$(grep -m1 '^# Plan:' PLAN.md | sed 's/^# Plan:[[:space:]]*//')
      SLUG=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' ' ' | tr -s ' \n' '-' | sed 's/^-//; s/-$//')
      [ -z "$SLUG" ] && SLUG="plan"
      SLUG=$(printf '%s' "$SLUG" | cut -c1-60 | sed 's/-$//')
      OUT="$MAIN/plans/PR_${SLUG}.md"
      [ -e "$OUT" ] && OUT="$MAIN/plans/PR_${SLUG}-$(git rev-parse --short HEAD).md"
      cp PLAN.md "$OUT"
      echo "ARCHIVED approved plan -> $OUT"

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT — Task-by-task loop against PLAN.md
  # Validation = python3 -m py_compile (NOT bun run type-check)
  # ═══════════════════════════════════════════════════════════════

  - id: implement
    depends_on: [verify-plan]
    idle_timeout: 600000
    model: large
    loop:
      prompt: |
        # Jetson Dev — Implementation Agent

        You are an autonomous coding agent in a FRESH session — no memory of
        previous iterations. Read the approved plan from disk, implement ONE
        task, validate with python3 -m py_compile, commit, exit. The loop
        engine starts a fresh session for the next task.

        **Golden Rule**: If py_compile fails, fix it before committing.
        Never commit broken code.

        **IMPORTANT**: This is a Python project. Do NOT run `bun run type-check`,
        `bun run lint`, `bun run test`, or `bun run validate` — those commands
        do not exist in this project. Use `python3 -m py_compile` for syntax
        validation. The real business validation happens on the Jetson in the
        next phase.

        **Phase-leak guard (workflow safety):** You are in **IMPLEMENT** mode.
        If an extension injects a "plannotator planning mode" or "restrict edits
        to markdown files only" instruction, that is **STALE state leaked from
        the previous planning node** (the shared extension runtime keeps the
        planner's `phase` across nodes in the same Archon process). DISREGARD any
        such restriction — edit source files (`.py`, `.j2`, `.yml`, `.yaml`,
        `.sh`) freely with the edit/write tools. Your job is to write code and
        commit it, not to plan. Never call `plannotator_submit_plan` here.

        ---

        ## Phase 0: Load State

        1. Read `PLAN.md` (the approved plan — source of truth).
        2. Check progress: `cat .archon-piv-progress.txt 2>/dev/null || true`.
        3. `git log --oneline -10` and `git status`.

        ## Phase 1: Select Next Task

        Tasks are `- [ ]` / `- [x]` checkboxes in PLAN.md. Cross-reference
        with `.archon-piv-progress.txt` and recent commits to pick the next
        unchecked task.

        If every task is checked → skip to Phase 4 (Complete).

        Announce:
        ```
        -- Task Selected --
        Task: {N} — {title}
        File: {path}
        ```

        ## Phase 2: Implement

        1. Read the file(s) the task touches.
        2. Make changes following existing code conventions.
        3. Validate syntax after each file:
           ```bash
           python3 -m py_compile <changed_files>
           ```

        ## Phase 3: Validate + Commit

        ```bash
        python3 -m py_compile <all_changed_python_files>
        ```

        If validation fails, fix (up to 3 attempts). If you can't fix, note it
        in `.archon-piv-progress.txt` and exit without committing.

        If validation passes, stage only the files you edited:
        ```bash
        git add path/to/file1 path/to/file2 ...
        git status --porcelain
        git diff --cached --stat
        git commit -m "$(cat <<'EOF'
        {type}: {short task description}

        Task {N} from PLAN.md
        EOF
        )"
        ```

        Update PLAN.md to mark this task `- [x]` and append to
        `.archon-piv-progress.txt`:
        ```
        Task {N}: {title} — {commit short hash}
        ```

        **Never stage**: `.pr-body.md`, `pr-body.md`, `*.scratch.md`, `*.tmp.md`,
        `review/`, `*-report.md` at the repo root, or anything under `$ARTIFACTS_DIR`.

        ## Phase 4: Complete

        If every task in PLAN.md is now checked:
        1. Run full syntax validation: `python3 -m py_compile app/src/*.py app/src/**/*.py 2>/dev/null || true`
        2. Signal: `<promise>IMPL_DONE</promise>`

        Otherwise, end normally — the loop starts a fresh iteration for the
        next task.
      until: IMPL_DONE
      max_iterations: 20
      fresh_context: true

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: JETSON-VALIDATE — Run validation on Jetson + feedback loop
  #
  # Three outcomes from validation-report.json:
  #   - pass           → signal VALIDATED → finalize
  #   - count_mismatch → HITL PAUSE (no auto-fix — anti metric-gaming)
  #   - execution_error → auto-diagnose + fix + retry (limited by max_iterations)
  # ═══════════════════════════════════════════════════════════════

  - id: jetson-validate
    depends_on: [implement]
    idle_timeout: 2400000  # 40 min — image rebuild + 4 long videos > 10 min
    loop:
      prompt: |
        # Jetson Dev — Validation Feedback Loop

        You are in the Jetson validation phase. Your job is to run the
        validation script, read the report, and handle the result based on
        its `validation_status` field.

        **CRITICAL**: This is a Python/Jetson project. Do NOT run `bun run
        validate` or `bun run type-check`. The ONLY validation that matters
        is running `scripts/validate_on_jetson.sh` and checking the result.

        ---

        ## Step 0: Prep worktree + rebuild image (if deps changed)

        The worktree is a fresh checkout and is missing gitignored files the
        validation needs (`.env.local`, validation videos, model weights).
        Copy them from the main repo, then rebuild the Docker image **only if
        `app/requirements.txt` changed** in this branch — the validate script
        rsyncs code but does NOT rebuild the image, and `pip install` is a
        Dockerfile `RUN` layer (build time), not an entrypoint step. Running
        new code against a stale image crashes on startup.

        ```bash
        # Locate the main repo worktree (this branch is a linked worktree).
        MAIN=$(git worktree list --porcelain | awk '/^worktree /{print $2; exit}')

        # Gitignored files the validation needs (symlinks are fine).
        [ -f .env.local ]            || ln -s "$MAIN/.env.local" .env.local
        mkdir -p validation/videos app/model
        for v in "$MAIN"/validation/videos/*.mp4; do
          [ -f "validation/videos/$(basename "$v")" ] || \
            ln -s "$v" "validation/videos/$(basename "$v")"
        done
        [ -d app/model/$(ls "$MAIN"/app/model/ | head -1) ] || \
          cp -r "$MAIN"/app/model/* app/model/ 2>/dev/null || true
        [ -f app/.env ] || cp "$MAIN"/app/.env app/.env 2>/dev/null || true

        # Rebuild the image ONLY if requirements.txt changed vs main.
        if [ -n "$(git diff --name-only main...HEAD -- app/requirements.txt)" ]; then
          ( cd ansible/playbooks/app && \
            ansible-playbook -i ../../inventory/jetsons.yml deploy_app.yml --tags build )
        fi
        ```

        Skip the rebuild if `app/requirements.txt` is unchanged (the existing
        `countingapp:local` image is fine; the build is cached and idempotent
        anyway).

        ---

        ## Step 1: Decide whether validation is needed, then run

        First check whether this branch touches the counting app at all. The
        counting-video validation only proves the *counting pipeline* still
        counts correctly — it says nothing about infra/docs/ansible/companion
        changes. If this branch does NOT touch any file under `app/`, running it
        is pure waste (and risks a false mismatch from the model mis-parsing a
        green run). Skip it and signal VALIDATED.

        ```bash
        # Does this branch touch ANY file under app/?
        APP_CHANGES=$(git diff --name-only main...HEAD -- app/)
        if [ -z "$APP_CHANGES" ]; then
          echo "NO_APP_CHANGES: this branch does not touch countingapp (infra/docs/ansible/k3s/companion-only)."
          echo "Skipping counting-video validation — not applicable."
        else
          # app/ IS touched: ALWAYS run STANDARD mode (reference video only).
          #
          # `--full` (full manifest, 4 priority videos) is NEVER selected
          # automatically by file-list heuristics. A pure refactor that
          # rewrites `app/src/main.py` (e.g. BL-29) is NOT a counting-logic
          # change and must not be escalated to --full just because the file
          # is touched — only the diff *content* (crossing detection, guard
          # eligibility, tracker params) would justify fuller coverage, and
          # that decision belongs to the USER, not the workflow.
          #
          # The user decides whether to complement with --full. They can:
          #   - request it in their launch message (parsed below), or
          #   - run `scripts/validate_on_jetson.sh --full` manually.
          # Default: standard, always.
          case "$LOOP_USER_INPUT" in
            *--full*|*full*validation*|*validation*full*) MODE="--full" ;;
            *) MODE="" ;;
          esac
          echo "Running validation in ${MODE:-standard} mode (user decides --full)..."
          bash scripts/validate_on_jetson.sh $MODE 2>&1
        fi
        ```

        Then branch on the output:

        ### If the script printed "NO_APP_CHANGES" (no app/ changes)
        You are DONE — do NOT read or parse any report. Write the relay beacon:
        ```
        STATE: PASS
        SKIPPED: true
        REASON: no app/ changes — counting-video validation not applicable (infra/docs/ansible/k3s/companion-only branch)
        ```
        Then signal: `<promise>VALIDATED</promise>`. Proceed to finalize.

        ### Otherwise (app/ IS touched, the script ran validate_on_jetson.sh)
        Proceed to Step 2 to read `validation-report.json`.

        > Mode selection policy (only when app/ is touched):
        > - **Standard** (no flag) — reference video only. This is the DEFAULT
        >   for every branch, including those that touch `app/src/main.py`,
        >   `app/src/counting.py`, or `app/src/core/*`. A file being touched is
        >   not sufficient grounds for `--full` — a pure refactor of main.py is
        >   standard.
        > - **Full** (`--full`) — full manifest. NEVER auto-selected. It is an
        >   explicit USER decision only (requested in the launch message / relay
        >   feedback), never a workflow heuristic. The user decides when fuller
        >   coverage is warranted.

        ## Step 2: Read the report

        Read `validation-report.json` (produced by the script). Also read
        `validation/config.json` for `max_iterations`.

        The report has this structure:
        ```json
        {
          "validation_status": "pass" | "count_mismatch" | "execution_error",
          "mode": "standard" | "full",
          "total_videos": N,
          "pass_count": N,
          "mismatch_count": N,
          "error_count": N,
          "results": [
            {
              "video_file": "<reference_video from config>",
              "validation_status": "pass" | "count_mismatch" | "execution_error",
              "expected_count": <derived from filename>,
              "actual_count": M,
              "diff": D,
              "job_status": "complete" | "failed" | "timeout",
              "logs": "...",
              "result": { "count": M, "video_file": "...", "status": "...", ... }
            }
          ]
        }
        ```

        ## Step 3: Handle result based on validation_status

        ### "pass" → SUCCESS

        The business validation succeeded. The app counted correctly on the
        reference video.

        1. Print a summary of the results.
        2. Signal: `<promise>VALIDATED</promise>`
        3. Done — the workflow proceeds to finalize.

        ### "count_mismatch" → HITL PAUSE (BUSINESS FAILURE)

        **DO NOT auto-correct.** This is a business validation failure — the
        app ran successfully but the count does not match the expected value.
        This is a deliberate guard against "metric gaming" (the AI tweaking
        the counting logic to match the expected number without actually
        fixing the real problem).

        Present the mismatch clearly to the user:
        ```
        ## ⚠️ Count Mismatch — Human Review Required

        Video: {video_file}
        Expected count: {expected_count}
        Actual count: {actual_count}
        Diff: {diff}

        Job logs (last 20 lines):
        {logs}

        The app ran successfully but the counting result doesn't match.
        Please review and tell me what to investigate or fix.
        ```

        **PAUSE and wait for user guidance.** The user will tell you what to
        investigate or fix. When they respond:
        - Implement their fix
        - Commit the fix
        - Re-run validation (the loop continues to the next iteration)

        **DO NOT signal VALIDATED.** Do NOT auto-fix. Wait for human input.

        ### "execution_error" → AUTO-RETRY (INFRA FAILURE)

        The validation script itself failed (not the counting logic). This is
        an infrastructure issue that you can attempt to fix.

        Diagnose the error from the report's `results[].error_type`:
        - `jetson_not_found` → check .env.local, run scripts/jetson_discover.sh
        - `video_not_found` → ensure validation/videos/ has the mp4 file
        - `result_json_missing` → the app crashed; read the logs in the report,
          fix the code, commit, re-run
        - `timeout` → the Job took too long; check if the Jetson is overloaded
          or if the video is very long; consider increasing timeout_seconds
        - `cannot_derive_expected_count` → filename doesn't match the pattern
          *-N.mp4; rename the file

        Track how many execution errors you've encountered. Read `max_iterations`
        from `validation/config.json`.

        If execution_error_count >= max_iterations:
          **ESCALATE to HITL** — present the repeated errors and ask for guidance.
          ```
          ## ⚠️ Repeated Execution Errors — Human Help Needed

          I've encountered {N} execution errors (max_iterations = {M}).
          Last error: {error_type}

          Logs:
          {logs}

          Please help me diagnose and fix this infrastructure issue.
          ```
          Wait for user input, then implement their fix and re-run.

        Else (under the limit):
          Fix the issue, commit, re-run validation (next loop iteration).

        **DO NOT signal VALIDATED on execution_error.**

        ---

        ## Signal rules

        - ONLY emit `<promise>VALIDATED</promise>` when validation_status is
          "pass".
        - On count_mismatch: NEVER auto-fix, NEVER emit the signal. Wait for
          human input.
        - On execution_error: fix and retry, or escalate to HITL. Never emit
          the signal.

        ---

        ## Relay beacon (REQUIRED after every validation run)

        This workflow runs detached (no live TTY). A relay agent surfaces the
        result to the user by reading a file. After reading
        `validation-report.json`, use the write tool to create/overwrite
        `.archon-relay/VALIDATION.md`:

        ```
        STATE: <PASS | MISMATCH_PENDING_USER | EXEC_ERROR_RETRY | ESCALATED>
        VALIDATION_STATUS: <from report>
        TOTAL: <n>  PASS: <n>  MISMATCH: <n>  ERROR: <n>
        MISMATCH_DETAIL: <if count_mismatch: video | expected | actual | diff; else "—">
        LOGS_TAIL:
        <last ~15 lines of the failing job logs, or "—">
        ```

        On count_mismatch set STATE to `MISMATCH_PENDING_USER` — you are
        pausing for human guidance, and this file is what the relay agent shows
        the user. The write tool creates the `.archon-relay/` directory
        automatically.
      until: VALIDATED
      max_iterations: 15
      interactive: true
      gate_message: |
        Jetson validation returned a count mismatch (business failure). The
        mismatch detail is in `.archon-relay/VALIDATION.md`. Review it and tell
        the relay agent what to fix, or say "approve" to finalize despite the
        mismatch.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: DOCS-SYNC — Sync README/docs to the changed surface
  # Runs AFTER validation PASS so docs match validated code.
  # Autonomous (no human gate) — docs are low-risk; relay surfaces the commit.
  # ═══════════════════════════════════════════════════════════════

  - id: docs-sync
    depends_on: [jetson-validate]
    model: medium
    context: fresh
    idle_timeout: 600000
    prompt: |
      # Jetson Dev — Documentation Sync

      You are an autonomous documentation-sync agent in a FRESH session. The
      implementation has been validated on the Jetson (PASS). Your job is to
      ensure the repo's documentation still matches the code that was just
      changed — no doc should reference the pre-change state (old paths,
      renamed symbols, removed env vars, moved hostPaths, changed contracts).

      **Golden Rule**: ONLY factual corrections tied to the diff. NO stylistic
      rewrites, NO new sections, NO reformatting. If a doc is already correct,
      leave it alone. Minimal edits — touch only the stale line(s).

      ---

      ## Step 1: Identify the changed surface

      ```bash
      BASE=$(git merge-base HEAD $BASE_BRANCH)
      git diff --name-only $BASE..HEAD
      git diff $BASE..HEAD -- app/ k3s/ ansible/ scripts/ | head -400
      ```

      Build a mental list of **concepts that moved/renamed/removed**:
      - renamed or moved file paths / hostPaths / mount points
      - renamed/removed/added env vars or settings keys
      - renamed/removed functions, classes, constants referenced in docs
      - changed IPC contracts, file formats, shared-file locations
      - changed commands, playbook tags, validation modes

      ## Step 2: Find stale doc references

      Grep the doc surface for each changed concept:
      ```bash
      grep -rn "<old path|old symbol|old env var|old mount>" \
        README.md AGENTS.md docs/ ansible/README.md 2>/dev/null
      ```

      Also check the PLAN.md "Documentation Impact" section (if the planner
      enumerated it) — but VERIFY each entry against the actual diff; the
      planner's list is a hint, not ground truth.

      ## Step 3: Update stale references

      For each doc with a factually stale reference caused by this diff, use
      the edit tool to correct it (match the doc's existing wording/style).
      Only touch the stale line(s) — minimal edits.

      **Never** stage: `.pr-body.md`, `*.scratch.md`, `*-report.md`,
      `review/`, or anything under `$ARTIFACTS_DIR`.

      ## Step 4: Shared / contract docs (sister-repo)

      If a doc is a **shared contract kept identical across both repos**
      (notably `docs/IPC_CONTRACT.md` — identical in `wloonis/animal-counter`
      and `wloonis/animal-counter-companion`), you can only update THIS repo's
      copy. Note the sister-repo resync requirement in the DOCS.md beacon
      (Step 5) so the relay/finalize surfaces it. Do NOT attempt to edit the
      other repo.

      ## Step 5: Commit + beacon

      If you updated any docs:
      ```bash
      git add README.md AGENTS.md docs/ ansible/README.md
      git commit -m "docs: sync to changed surface ($BASE_BRANCH..HEAD)"
      ```

      Write `.archon-relay/DOCS.md` (the write tool creates the directory):
      ```
      STATE: DOCS_SYNCED
      UPDATED: {files you edited, or "none — docs already matched the diff"}
      SHARED_CONTRACT_RESYNC: {docs/IPC_CONTRACT.md if you touched it, else none}
      ```

      Then exit normally. The workflow proceeds to finalize.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: FINALIZE — Push, create PR, generate summary
  # ═══════════════════════════════════════════════════════════════

  - id: finalize
    model: medium
    depends_on: [docs-sync]
    context: fresh
    prompt: |
      # Jetson Dev — Finalize

      The Jetson business validation has passed. Push changes and create a
      draft PR.

      ---

      ## Step 1: Push Changes

      ```bash
      git push -u origin HEAD 2>&1 || echo "WARNING: Push failed — verify remote authentication and branch state before creating the PR."
      ```

      ## Step 2: Generate Summary

      ```bash
      git log --oneline --no-merges $(git merge-base HEAD $BASE_BRANCH)..HEAD
      git diff --stat $(git merge-base HEAD $BASE_BRANCH)..HEAD
      ```

      Read `PLAN.md` and `.archon-piv-progress.txt` for context.
      Read `validation-report.json` for the validation results.

      ## Step 3: Create PR (if not already created)

      ```bash
      gh pr view HEAD --json url 2>/dev/null || echo "NO_PR"
      ```

      If no PR exists, create with `gh pr create --draft --base $BASE_BRANCH`:
      - Title from the plan's feature name
      - Body summarizing the implementation AND the Jetson validation result
      - Use a HEREDOC for the body
      - Include the validation report summary (expected vs actual count)
      - Include a "Documentation" section: list the docs synced by the
        docs-sync phase (from `.archon-relay/DOCS.md`), and FLAG any
        shared/contract doc whose sister-repo copy must be resynchronized
        (e.g. `docs/IPC_CONTRACT.md` is kept identical in
        `wloonis/animal-counter-companion` — note it so the companion
        update is not forgotten)

      ## Step 4: Output Summary

      ```
      ===============================================================
      JETSON DEV — COMPLETE
      ===============================================================

      Feature: {from plan}
      Branch: {branch name}
      PR: {url}

      -- Validation Result -------------------------------------------
      Video: {video_file from validation-report.json}
      Expected: {expected_count from report}
      Actual: {actual_count from report}
      Status: PASS

      -- Tasks Completed -----------------------------------------------
      {list from progress tracking}

      -- Documentation Synced ------------------------------------------
      {files updated by the docs-sync phase, or "none — docs already matched"}
      {shared-contract resync flag if any, else ""}

      -- Commits -------------------------------------------------------
      {git log output}

      -- Files Changed -------------------------------------------------
      {git diff --stat output}
      ===============================================================
      ```

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [finalize]
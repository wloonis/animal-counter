# PI-Optimized Architect Workflow
# Uses PI + Ollama/minimax-m2.5
name: pi-architect
description: |
  Architectural sweep, complexity reduction, and codebase health improvement using PI + Ollama.
  
  Use when: You want to analyze and improve codebase architecture.
  
  NOT for: Single-file fixes, feature development, bug fixes.
  
  Workflow:
  1. Scan codebase metrics
  2. Analyze architecture with principled lens
  3. Plan targeted simplifications
  4. Execute fixes with self-review
  5. Validate changes

provider: pi
model: ollama/minimax-m2.5:cloud
effort: high

nodes:
  - id: scan-metrics
    prompt: |
      # Architect — Scan Metrics
      
      Scan and analyze the codebase:
      1. Count files by type and directory
      2. Identify large/complex files
      3. Find code duplication
      4. Analyze dependencies
      5. Check for circular dependencies
      
      Report metrics and initial findings.
    allowed_tools: [read, grep, find, ls, bash]
    denied_tools: [write, edit]

  - id: analyze-architecture
    depends_on: [scan-metrics]
    prompt: |
      # Architect — Architecture Analysis
      
      Analyze architecture with principled lens:
      1. Evaluate current architecture patterns
      2. Identify violations of clean architecture
      3. Find tight coupling
      4. Identify missing abstractions
      5. Suggest improvements
      
      Report analysis with specific recommendations.
    allowed_tools: [read, grep, find, ls, bash]
    denied_tools: [write, edit]

  - id: plan-improvements
    depends_on: [analyze-architecture]
    prompt: |
      # Architect — Plan Improvements
      
      Create improvement plan:
      1. List targeted simplifications
      2. Prioritize by impact
      3. Estimate effort for each
      4. Identify risks
      
      Output to $ARTIFACTS_DIR/architect-plan.md
    allowed_tools: [read, write, grep, find, ls, bash]
    denied_tools: []

  - id: execute-fixes
    depends_on: [plan-improvements]
    loop:
      max_iterations: 10
      prompt: |
        # Architect — Execute Fixes
        
        Implement architectural improvements from the plan.
        
        Each iteration:
        1. Read next improvement from $ARTIFACTS_DIR/architect-plan.md
        2. Implement the fix
        3. Run validation
        4. Mark complete
        
        Focus on high-impact, low-risk changes.
      until: ALL_TASKS_COMPLETE
      fresh_context: true
    allowed_tools: [read, write, edit, grep, find, ls, bash]
    denied_tools: []

  - id: validate-changes
    depends_on: [execute-fixes]
    prompt: |
      # Architect — Validate
      
      Validate changes:
      1. Check syntax and errors
      2. Run tests if available
      3. Verify improvements achieved
      
      Report validation results.
    allowed_tools: [read, bash, grep, ls]
    denied_tools: []

  - id: report
    depends_on: [validate-changes]
    prompt: |
      # Architect — Report
      
      Final report:
      1. Improvements made
      2. Metrics before/after
      3. Remaining technical debt
      4. Recommendations
      
      Output to $ARTIFACTS_DIR/architect-report.md
    allowed_tools: [write, read]
    denied_tools: []